# Stage E：容器内 nginx 反代 + 负载均衡
#
# 监听 8080（容器内端口），least_conn 算法把请求分给 4×web:10846。
# 对外 HTTPS 由前端 nginx / slb 终止 —— 本容器只跑内网 7 层 LB。

worker_processes 1;
events { worker_connections 2048; }

http {
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    upstream vgis_web {
        # least_conn：把请求分给当前连接最少的 worker，POST + 长请求友好
        least_conn;

        # 当 web 用 docker-compose --scale web=4 拉满时这里列 4 个；
        # 默认只起 1 个时其它会 502，但不会让整个集群挂掉。
        server web:10846 max_fails=3 fail_timeout=10s;
        # server web_2:10846 max_fails=3 fail_timeout=10s;
        # server web_3:10846 max_fails=3 fail_timeout=10s;
        # server web_4:10846 max_fails=3 fail_timeout=10s;

        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # 安全响应头（与 nginx.conf 对外 443 块保持一致）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location / {
            proxy_pass http://vgis_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            client_max_body_size  100m;
        }
    }
}