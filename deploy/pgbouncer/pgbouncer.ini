; Stage E：pgbouncer 配置（部署到 40 服务器时启用）
;
; 设计：
;   - listen_addr=0.0.0.0，让外部 web 容器能连
;   - auth_type=md5：与 PG password_encryption=md5 配套（如 PG 已切 scram-sha-256 则改 scram-sha-256）
;   - pool_mode=transaction：每个事务结束即归还连接，
;     适合 Django CONN_MAX_AGE=0 + 短事务场景；
;     若要持久连接可改 session
;   - max_client_conn=10000 / default_pool_size=20：
;     默认 100 个 PG 连接足够 4×web + 2×celery worker 共用
;
; 用法：
;   docker run -d --name pgbouncer \
;     -p 6432:6432 \
;     -v $PWD/deploy/pgbouncer:/etc/pgbouncer:ro \
;     -v $PWD/deploy/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro \
;     edoburu/pgbouncer:1.22.1
;
; 然后 web 容器启动时设置：
;   PGBOUNCER_ENABLED=true  PGBOUNCER_HOST=pgbouncer  PGBOUNCER_PORT=6432

[databases]
mydb_test = host=192.168.3.40 port=12326 dbname=mydb_test
mydb      = host=192.168.3.40 port=12326 dbname=mydb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

admin_users = postgres
stats_users = postgres

pool_mode = transaction
max_client_conn = 10000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

server_idle_timeout = 600
server_lifetime = 3600
server_connect_timeout = 15
client_idle_timeout = 0
query_timeout = 0
client_login_timeout = 60

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

# 默认关闭 TLS（容器内网 + 后端才是 PG，对外不暴露）
ssl_mode = prefer
ssl_ca_file =